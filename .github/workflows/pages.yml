name: Deploy OpsDesk demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out demo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage demo
        run: install -D -m 644 index.html _site/index.html
      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
